server.port=8081
spring.application.name=mesatech-solicitudes

# Amazon RDS MySQL exclusivo de este microservicio. Credenciales por variables de entorno (ver .env.example)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# RabbitMQ (consumidor de eventos de categorías)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.username=${RABBITMQ_USER:mesatech_consumidor}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=true
app.rabbitmq.queue=solicitudes.catalogo.queue
spring.rabbitmq.listener.simple.auto-startup=true
