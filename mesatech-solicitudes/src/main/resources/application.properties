server.port=8081
spring.application.name=mesatech-solicitudes

# Base de datos H2 en modo compatibilidad MySQL para entorno local y tests
spring.datasource.url=jdbc:h2:mem:mesatech_solicitudes_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# RabbitMQ (consumidor de eventos de categorías)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.username=${RABBITMQ_USER:mesatech_consumidor}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=true
app.rabbitmq.queue=solicitudes.catalogo.queue
# En desarrollo local/tests no se conecta al broker; activar con RABBITMQ_LISTENER_AUTOSTART=true
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_AUTOSTART:false}
