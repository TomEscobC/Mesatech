server.port=8080
spring.application.name=mesatech-bff

# Microsoft Entra ID - OAuth2 Resource Server (valida firma por JWKS, issuer, audience y expiración)
# AZURE_TENANT_ID y AZURE_AUDIENCE se entregan por variable de entorno (ver .env.example)
azure.tenant-id=${AZURE_TENANT_ID:00000000-0000-0000-0000-000000000000}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${azure.tenant-id}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AUDIENCE:api://api-cloud-native}

# URLs de microservicios internos (el BFF no accede a ninguna base de datos)
services.solicitudes.url=${SERVICES_SOLICITUDES_URL:http://localhost:8081}
services.catalogo.url=${SERVICES_CATALOGO_URL:http://localhost:8082}

# CORS: mismo origen que el configurado en API Gateway
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
