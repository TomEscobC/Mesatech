server.port=8082
spring.application.name=mesatech-catalogo

# Base de datos H2 en modo MySQL para desarrollo local y pruebas
spring.datasource.url=jdbc:h2:mem:mesatech_catalogo_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# RabbitMQ (publicador de eventos de categorías)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.username=${RABBITMQ_USER:mesatech_publicador}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
# Confirmaciones del broker y retornos por ausencia de ruta
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
app.rabbitmq.exchange=catalogo.exchange
app.rabbitmq.routing-key=categoria.creada
app.rabbitmq.confirm-timeout-ms=5000
